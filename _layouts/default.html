<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | 우아타자{% else %}우아타자 - 테마별 타자연습 게임{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | 우아타자{% else %}우아타자 - 테마별 타자연습 게임{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:image" content="{{ '/assets/og-image.png' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="우아타자">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9ZGENFSXWC"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-9ZGENFSXWC');</script>

  <!-- AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6464921081676309" crossorigin="anonymous"></script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <span class="logo-icon">⌨️</span>
      <span class="logo-text">우아타자</span>
    </a>
    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}">테마 선택</a>
      <a href="https://wooahouse.com">WooaHouse →</a>
    </nav>
  </div>
</header>

<script src="{{ '/assets/js/wooa-sites-bar.js' | relative_url }}"></script>
<script src="{{ '/assets/js/ad-dev-placeholder.js' | relative_url }}"></script>

{% unless page.layout == 'type-theme' or page.url == '/' %}
<div class="top-ad-bar">
  {% include ad.html %}
</div>
{% endunless %}

<main class="site-main">
  {{ content }}
</main>
<script src="{{ '/assets/js/wooa-sidebar.js' | relative_url }}"></script>

<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-disclaimer">
      우아타자는 재미로 즐기는 타자연습 게임입니다. 언급된 상품명은 각 상표권자의 소유이며, 브랜드 홍보나 협찬과 무관합니다.
    </p>
    <p class="footer-links">
      <a href="https://wooahouse.com">WooaHouse</a> ·
      <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
    </p>
    <p class="copyright">&copy; 2026 우아타자 · WooaHouse. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
